<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Drill 2</title>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 50%, #7c3aed 100%);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        }
        .app-card {
            background: #ffffff;
            border: 0;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .app-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
            padding: 28px 32px;
        }
        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0;
        }
        .app-header p {
            margin: 6px 0 0;
            opacity: 0.85;
        }
        .app-body {
            padding: 32px;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 12px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
            color: #ffffff;
        }
        .results {
            margin-top: 28px;
            padding: 24px;
            border-radius: 16px;
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
        }
        .results-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6d28d9;
            margin-bottom: 12px;
        }
        .member-badge {
            display: inline-block;
            margin: 4px 6px 4px 0;
            padding: 8px 16px;
            border-radius: 999px;
            background: #ffffff;
            color: #3730a3;
            font-weight: 500;
            border: 1px solid #c7d2fe;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.1);
        }
        .total-box {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 22px;
            padding: 16px 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
        }
        .total-number {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1;
        }
        .total-label {
            font-weight: 600;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 720px;">
        <div class="app-card">
            <div class="app-header">
                <h1>Student Club Members</h1>
                <p>Add a new member and see the updated master list.</p>
            </div>
            <div class="app-body">
                <form>
                    <div class="mb-3">
                        <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
                    </div>
                    <div class="mb-3">
                        <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
                    </div>
                    <input type="button" value="Add Member" py-click="result_checker" class="btn btn-submit">
                </form>
                <div id="output" class="results"></div>
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
