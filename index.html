<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>2nd Quarter | Drill 2</title>
    <style>
        * {
            font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.35), transparent 40%),
                linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            background-attachment: fixed;
        }
        .app-card {
            background: rgba(255, 255, 255, 0.97);
            border: 0;
            border-radius: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: fadeUp 0.7s ease both;
        }
        .app-header {
            position: relative;
            background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #db2777);
            color: #ffffff;
            padding: 36px 36px 40px;
            overflow: hidden;
        }
        .app-header::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
        }
        .app-header::after {
            content: "";
            position: absolute;
            bottom: -80px;
            right: 90px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }
        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            margin-bottom: 14px;
            border-radius: 16px;
            font-size: 1.7rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
        }
        .app-header h1 {
            position: relative;
            font-size: 1.85rem;
            font-weight: 800;
            margin: 0;
        }
        .app-header p {
            position: relative;
            margin: 6px 0 0;
            opacity: 0.9;
        }
        .app-body {
            padding: 36px;
        }
        .field-label {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 14px;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            background: #f9fafb;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #db2777);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(124, 58, 237, 0.45);
            color: #ffffff;
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .divider {
            height: 1px;
            margin: 32px 0 28px;
            background: linear-gradient(90deg, transparent, #ddd6fe, transparent);
        }
        .welcome {
            margin-bottom: 18px;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 600;
            color: #065f46;
            background: #d1fae5;
            border: 1px solid #6ee7b7;
            animation: pop 0.45s ease both;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 26px;
        }
        .stat {
            padding: 16px 8px;
            text-align: center;
            border-radius: 16px;
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            transition: transform 0.2s ease;
        }
        .stat:hover {
            transform: translateY(-4px);
        }
        .stat-new {
            background: #fdf2f8;
            border-color: #fbcfe8;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #4f46e5;
            line-height: 1.1;
        }
        .stat-new .stat-value {
            color: #db2777;
        }
        .stat-label {
            margin-top: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #6b7280;
        }
        .results-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #6d28d9;
            margin-bottom: 14px;
        }
        .members-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .member-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 18px 6px 6px;
            border-radius: 999px;
            background: #ffffff;
            color: #1f2937;
            font-weight: 500;
            font-size: 0.92rem;
            border: 1px solid #e0e7ff;
            box-shadow: 0 3px 10px rgba(79, 70, 229, 0.1);
            animation: pop 0.4s ease both;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .member-chip:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.22);
        }
        .avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 0.78rem;
            font-weight: 700;
            color: #ffffff;
        }
        .total-box {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 28px;
            padding: 20px 26px;
            border-radius: 20px;
            color: #ffffff;
            background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #db2777);
            box-shadow: 0 14px 30px rgba(124, 58, 237, 0.35);
        }
        .total-number {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
        }
        .total-label {
            font-weight: 600;
            font-size: 1.05rem;
            opacity: 0.95;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 576px) {
            .app-body { padding: 24px; }
            .app-header { padding: 28px 24px 32px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 780px;">
        <div class="app-card">
            <div class="app-header">
                <div class="header-icon">🎓</div>
                <h1>Student Club Members</h1>
                <p>Add a new member and watch the master list update.</p>
            </div>
            <div class="app-body">
                <form>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="field-label">First name</div>
                            <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
                        </div>
                        <div class="col-md-6">
                            <div class="field-label">Last name</div>
                            <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
                        </div>
                    </div>
                    <input type="button" value="Add Member" py-click="result_checker" class="btn btn-submit">
                </form>
                <div class="divider"></div>
                <div id="output"></div>
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
